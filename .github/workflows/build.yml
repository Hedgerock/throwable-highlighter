name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, verify, and build
        run: ./gradlew test verifyPlugin buildPlugin --no-daemon

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: throwable-highlighter
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Test local check runner
        run: node --test scripts/test/*.test.cjs
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, compile, and test
        run: npm run check

  vscode-browser:
    name: VS Code browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run browser and visual checks
        run: docker compose run --rm -e CI=true visual

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-browser-diagnostics
          path: |
            extensions/vscode/playwright-report/
            extensions/vscode/test-results/
          if-no-files-found: warn
          retention-days: 14

  vscode-extension-host:
    name: VS Code Extension Host
    runs-on: windows-2025
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/vscode
        shell: pwsh

    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Record test environment
        run: |
          $diagnosticDirectory = ".vscode-test/diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          
          @(
            "Runner image: $env:ImageOS"
            "Image version: $env:ImageVersion"
            "Node.js: $(node --version)"
            "npm: $(npm --version)"
            "JAVA_HOME: $env:JAVA_HOME"
          ) | Set-Content -LiteralPath "$diagnosticDirectory/environment.txt" -Encoding utf8
          
          java --version 2>&1 | Add-Content -LiteralPath "$diagnosticDirectory/environment.txt" -Encoding utf8
          
          Copy-Item -LiteralPath ".vscode-test.mjs" -Destination "$diagnosticDirectory/test-config.mjs"

      - name: Install dependencies
        run: npm ci

      - name: Run Extension Host tests
        timeout-minutes: 12
        run: |
          npm run test:extension-host 2>&1 | Tee-Object -FilePath ".vscode-test/diagnostics/extension-host.log"
          
          exit $LASTEXITCODE

      - name: Upload Extension Host diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-host-diagnostics
          path: |
            extensions/vscode/.vscode-test/diagnostics/
            extensions/vscode/.vscode-test/user-data/logs/
            extensions/vscode/.vscode-test/run-*/user-data/logs/
            extensions/vscode/.vscode-test/run-*/user-data/User/workspaceStorage/**/redhat.java/**/.metadata/.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
