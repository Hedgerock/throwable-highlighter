name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, verify, and build
        run: ./gradlew test verifyPlugin buildPlugin --no-daemon

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: throwable-highlighter
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  vscode:
    name: VS Code prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: prototypes/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototypes/vscode/package-lock.json

      - name: Test local check runner
        run: node --test scripts/test/*.test.cjs
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, compile, and test
        run: npm run check
