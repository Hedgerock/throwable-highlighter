name: Release VS Code

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: VS Code checks
    uses: ./.github/workflows/check-vscode.yml

  package:
    name: Build VSIX
    needs: checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Validate package version
        id: manifest
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const {appendFileSync} = require("node:fs");
          const {version} = require("./package.json");
          const lock = require("./package-lock.json");

          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(lock.version, version, "Lockfile version must match package.json");
          assert.equal(lock.packages?.[""]?.version, version, "Root package version in lockfile must match package.json");
          appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build extension package
        run: npm run build

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: throwable-highlighter-vsix
          path: extensions/vscode/build/distributions/throwable-highlighter-${{ steps.manifest.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 14
