name: Release VS Code

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*.*.*"

permissions:
  contents: read

jobs:
  checks:
    name: VS Code checks
    uses: ./.github/workflows/check-vscode.yml

  package:
    name: Build VSIX
    needs: checks
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Validate package version
        id: manifest
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const {appendFileSync} = require("node:fs");
          const {version} = require("./package.json");
          const lock = require("./package-lock.json");

          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(lock.version, version, "Lockfile version must match package.json");
          assert.equal(lock.packages?.[""]?.version, version, "Root package version in lockfile must match package.json");
          
          if (process.env.GITHUB_EVENT_NAME === "push") {
            assert.equal(process.env.GITHUB_REF_NAME, "vscode-v" + version, "Release tag must match package.json");
          }
          
          appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build extension package
        run: npm run build

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: throwable-highlighter-vsix
          path: extensions/vscode/build/distributions/throwable-highlighter-${{ steps.manifest.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Visual Studio Marketplace
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: vscode-marketplace

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        id: download
        uses: actions/download-artifact@v4
        with:
          name: throwable-highlighter-vsix
          path: ${{ runner.temp }}/throwable-highlighter-vsix

      - name: Publish VSIX
        env:
          VSIX_PATH: ${{ steps.download.outputs.download-path }}/throwable-highlighter-${{needs.package.outputs.version}}.vsix
        run: ./node_modules/.bin/vsce publish --oidc --packagePath "$VSIX_PATH"
